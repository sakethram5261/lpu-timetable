name: Sync Timetable

on:
  schedule:
    # Runs at 18:35 UTC every Sunday (00:05 IST Monday morning)
    - cron: '35 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Timetable Scraper
        env:
          LPU_REG_ID: ${{ secrets.LPU_REG_ID }}
          LPU_PASSWORD: ${{ secrets.LPU_PASSWORD }}
        run: |
          python scraper.py

      - name: Upload Debug Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: debug_*.png
          if-no-files-found: ignore

      - name: Commit & Push Synced Calendar
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add timetable.ics
          if git diff --staged --quiet; then
            echo "No changes detected in timetable.ics"
          else
            git commit -m "Auto-sync timetable.ics [skip ci]"
            git push
          fi
